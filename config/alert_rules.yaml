alerts:
  - name: high_latency_p95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack:#day13-llmops-alerts
    owner: on-call-student
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack:#day13-llmops-alerts
    owner: on-call-student
    runbook: docs/alerts.md#alert-2
  - name: low_retrieval_success
    severity: warning
    condition: 'count(tool_success == true) / count(tool_success != null) * 100 < 90'
    duration: 10m
    type: symptom-based
    channel: slack:#day13-llmops-alerts
    owner: on-call-student
    runbook: docs/alerts.md#alert-3
